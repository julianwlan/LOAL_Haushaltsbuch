<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budget Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/faviconAndLogo.png">
</head>
<body>
    <nav id="nav-bar">
        <div>
            <img src="img/faviconAndLogo.png" alt="Hand with coin" class="logo">
        </div>
        <a href="/" id="home-btn" class="nav-btn">Home</a>
        <a href="/analysis" id="analysis-btn" class="nav-btn">Analysis</a>
    </nav>

    <form id="booking-form">
        <div class="toggled">
            <button id="income-toggle" class="toggle-element">Income</button>
            <button id="expense-toggle" class="toggle-element">Expenses</button>
        </div>

        <input type="text" name="description" id="descr-input" placeholder="Brief Description">
        <div>
            <input type="number" name="amount" id="amnt-input" placeholder="1000">
            <span>€</span>
        </div>
        <input type="date" id="date-input">

        <div class="category-add">
            <button id="showCategoryInput" type="button">+</button>

            <div id="categoryInputContainer" hidden>
                <input type="text" id="categoryName" placeholder="Category name">

                <label>
                    <input type="radio" name="categoryType" value="Income" checked>
                    Income
                </label>

                <label>
                    <input type="radio" name="categoryType" value="Expenditure">
                    Expenditure
                </label>

                <button id="addCategoryBtn" type="button">Add</button>
                <button id="cancelAddCategoryBtn" type="button">Cancel</button>
            </div>
        </div>

        <div id="radio-div"></div>

        <button id="saveDataBtn">Save Data</button>
    </form>

    <script src="main.js"></script>
</body>
</html>
