<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Budget Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/faviconAndLogo.png">
</head>
<body>
    <nav id="nav-bar">
        <div>
            <img src="img/faviconAndLogo.png" alt="Hand with coin" class="logo">
        </div>
        <a href="/" id="home-btn" class="nav-btn">Home</a>
        <a href="/analysis" id="analysis-btn" class="nav-btn">Analysis</a>
    </nav>

    <div id="container">
        <form id="booking-form">
            <div id="toggled" role="group" aria-label="Buchungstyp">
                <button type="button" id="income-toggle" class="toggle-element clicked" aria-pressed="true">Income</button>
                <button type="button" id="expense-toggle" class="toggle-element" aria-pressed="false">Expense</button>
            </div>

            <input type="text" name="description" id="descr-input" placeholder="Brief Description">

            <input type="number" name="amount" id="amnt-input" placeholder="10 €">

            <div id="radio-div"></div>

            <button type="submit" id="submit-btn">Add to balance</button>
        </form>

        <div id="booking-history">
            <div class="history-entry">Hallo</div>
            <div class="history-entry">Hallo</div>
            <div class="history-entry">Hallo</div>
            <div class="history-entry">Hallo</div>
            <div class="history-entry">Hallo</div>

        </div>

        <script src="main.js"></script>
    </div>
</body>
</html>
